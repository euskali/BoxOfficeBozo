# Push to main, every Monday, or by hand: build the data in CI (the only place network
# fetching runs), then the site, and deploy it to GitHub Pages. Built Parquet is never
# committed; it ships only inside the Pages artifact.
#
# The data is built in passes (build-data.yml). Usually the raw-download cache holds nearly
# everything and pass 1 finishes. From an empty cache (GitHub deletes caches unused for 7 days)
# the fetch takes longer than one job may run: the first full fetch of the weekend charts
# alone took 270 minutes. So a pass that isn't done saves the cache and hands over to the next,
# up to three, and the site deploys once one finishes. The live site keeps its last deploy
# until then.
name: Build data and deploy

on:
  push:
    branches: [main]
  # Every Monday: picks up the newest archived weekend and redeploys. It also keeps the
  # raw-download cache in use. GitHub turns schedules off after 60 days without repository
  # activity; turn it back on from the Actions tab.
  schedule:
    - cron: "37 14 * * 1"
  workflow_dispatch:
    inputs:
      cold_start:
        description: >-
          Rehearse a cold start: begin from an empty raw-download cache of this run's own
          (the shared cache is untouched), fetch everything again in passes, then deploy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pass-1:
    name: Data pass 1
    uses: ./.github/workflows/build-data.yml
    with:
      pass: 1
      # A cold-start rehearsal keeps its downloads under a prefix of its own, so it starts empty,
      # its later passes (and re-runs) continue from it, and later runs never restore it.
      cache_prefix: ${{ inputs.cold_start && format('raw-cold-{0}-', github.run_id) || 'raw-v1-' }}
      # Project site: /<repo>/. Set the SITE_BASE_PATH repo variable to "/" for a custom domain.
      base_path: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

  pass-2:
    name: Data pass 2
    needs: pass-1
    if: needs.pass-1.outputs.complete != 'true'
    uses: ./.github/workflows/build-data.yml
    with:
      pass: 2
      cache_prefix: ${{ inputs.cold_start && format('raw-cold-{0}-', github.run_id) || 'raw-v1-' }}
      base_path: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

  pass-3:
    name: Data pass 3
    needs: pass-2
    if: needs.pass-2.outputs.complete != 'true'
    uses: ./.github/workflows/build-data.yml
    with:
      pass: 3
      last: true  # tests and builds the site even if something is still unfetched
      cache_prefix: ${{ inputs.cold_start && format('raw-cold-{0}-', github.run_id) || 'raw-v1-' }}
      base_path: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [pass-1, pass-2, pass-3]
    # The pass that finished the fetch (or the last pass) passed its tests and checks and
    # uploaded the site. Passes that weren't needed are skipped.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.pass-1.outputs.complete == 'true' || needs.pass-2.outputs.complete == 'true'
          || needs.pass-3.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
